<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVORA - Your Cart</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body>
    <header class="navbar">
        <img src="../images/logo/avora.png" alt="AVORA" class="nav-logo" onclick="window.location.href='products.html'">
        <div class="nav-links">
            <a href="cart.html" class="nav-item">🛒 Cart (<span id="nav-cart-count">0</span>)</a>
            <span>|</span>
            <a href="profile.html" class="nav-item">Profile</a>
            <span>|</span>
            <span onclick="openLogoutModal()" class="nav-item">Logout ➔</span>
        </div>
    </header>

    <main class="container">
        <h1>Your cart</h1>
        <div class="cart-layout">
            <div id="cart-items-container"></div>

            <div class="summary-box">
                <h2>Order summary</h2>
                <div class="summary-row">
                    <span>Items</span>
                    <span id="summary-total-items">0</span>
                </div>
                <hr>
                <div id="summary-breakdown"></div>
                <hr>
                <div class="payment-group">
                    <label for="payment-method">Payment Method</label>
                    <select id="payment-method">
                        <option value="Cash on Delivery">Cash on Delivery</option>
                        <option value="GCash">GCash</option>
                        <option value="Maya">Maya</option>
                    </select>
                </div>
                <hr>
                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="summary-total-price">₱0</span>
                </div>
                <button class="btn-get-started" style="width:100%; margin-top:10px;" onclick="checkout()">Checkout</button>
                <button class="btn-outline-dark" onclick="window.location.href='products.html'">Add more items</button>
            </div>
        </div>
    </main>

    <div id="logout-modal" class="modal-backdrop">
        <div class="modal-box">
            <h3>Logout?</h3>
            <p>Are you sure you want to log out? Your current cart items will be cleared.</p>
            <div class="modal-actions">
                <button type="button" class="btn-modal-back" onclick="closeLogoutModal()">Back</button>
                <button type="button" class="btn-modal-sure" onclick="confirmLogout()">Sure</button>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
