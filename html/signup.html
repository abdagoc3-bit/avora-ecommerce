<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVORA - Create Account</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body class="center-screen">
    <div class="signup-card">
        <img src="../images/logo/avora.png" alt="AVORA Logo" class="signup-logo">
        <h2>Create Account</h2>
        <p class="subtitle">Sign up to start ordering school supplies.</p>

        <form id="signup-form" onsubmit="handleSignup(event)" novalidate>
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <div class="input-box">
                    <span>👤</span>
                    <input type="text" id="fullname" placeholder="Enter your full name">
                </div>
                <small id="fullname-error" class="error-msg"></small>
            </div>

            <div class="input-group">
                <label for="signup-email">Email</label>
                <div class="input-box">
                    <span>✉︎</span>
                    <input type="email" id="signup-email" placeholder="Enter your email">
                </div>
                <small id="signup-email-error" class="error-msg"></small>
            </div>

            <div class="input-group">
                <label for="signup-password">Password</label>
                <div class="input-box">
                    <span>🔒︎</span>
                    <input type="password" id="signup-password" placeholder="At least 8 characters">
                    <span class="eye-icon" onclick="toggleSignupPassword('signup-password')">👁</span>
                </div>
                <small id="signup-password-error" class="error-msg"></small>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-box">
                    <span>🔒︎</span>
                    <input type="password" id="confirm-password" placeholder="Re-enter password">
                    <span class="eye-icon" onclick="toggleSignupPassword('confirm-password')">👁</span>
                </div>
                <small id="confirm-password-error" class="error-msg"></small>
            </div>

            <button type="submit" class="btn-signup">Create account</button>
        </form>

        <p class="login-redirect">Already have an account? <a href="login.html" class="link-blue">Sign in</a></p>
    </div>

    <script src="../js/signup.js"></script>
</body>
</html>
