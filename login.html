<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVORA - Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="center-screen">
    <div class="login-card">
        <img src="avora.png" alt="AVORA" class="login-logo">
        <h2>Welcome</h2>
        <p class="subtitle">Sign in to order your school supplies.</p>

        <form id="login-form" onsubmit="handleLogin(event)" novalidate>
            <div class="input-group">
                <label for="email">Username</label>
                <div class="input-box">
                    <span>✉︎</span>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <small id="email-error" class="error-msg"></small>
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="password">Password</label>
                    <a href="#" class="link-small">Forgot password?</a>
                </div>
                <div class="input-box">
                    <span>🔒︎</span>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <span class="eye-icon" onclick="togglePassword()">👁</span>
                </div>
                <small id="password-error" class="error-msg"></small>
            </div>

            <button type="submit" class="btn-signin">Sign in</button>
        </form>

        <p class="signup-text">New to Avora? <a href="signup.html" class="link-blue">Create an account</a></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
